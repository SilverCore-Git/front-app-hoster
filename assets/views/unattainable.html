<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Indisponible - Silvercore host</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#646cff', danger: '#ff6464', dark: '#0a0a0a' },
                    animation: { 'shake': 'shake 0.82s cubic-bezier(.36,.07,.19,.97) both' },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-white h-screen flex flex-col items-center justify-center overflow-hidden relative">

    <div class="relative z-10 flex flex-col items-center text-center px-4">
        <div class="mb-12 animate-shake">
            <div class="w-24 h-24 rounded-full bg-danger/5 flex items-center justify-center shadow-[0_0_40px_rgba(255,100,100,0.1)] backdrop-blur-sm border border-danger/20">
                <i class="bi bi-exclamation-triangle-fill text-4xl text-danger/80"></i>
            </div>
        </div>

        <h1 class="text-4xl md:text-6xl font-bold tracking-tight mb-6 bg-clip-text text-transparent bg-gradient-to-b from-white to-white/40 pb-2">
            Hors service
        </h1>

        <p class="text-lg text-gray-400 font-light max-w-md leading-relaxed mx-auto">
            Le service est temporairement inaccessible. Nos équipes ont été alertées du problème.
        </p>

        <button onclick="window.location.reload()" class="mt-12 px-8 py-3 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 transition-all text-sm font-semibold tracking-wide flex items-center gap-2 group">
            <i class="bi bi-arrow-clockwise group-hover:rotate-180 transition-transform duration-500"></i>
            Réessayer la connexion
        </button>
    </div>

    <div class="absolute bottom-8 w-full text-center">
        <p class="text-white/20 text-xs tracking-[0.2em] font-medium uppercase">&copy; Silvercore host</p>
    </div>

</body>
</html>
