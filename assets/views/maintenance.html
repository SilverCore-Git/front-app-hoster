<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - Silvercore host</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#646cff', dark: '#0a0a0a' },
                    animation: { 'float': 'float 7s ease-in-out infinite' },
                    keyframes: { float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-15px)' } } }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-white h-screen flex flex-col items-center justify-center overflow-hidden relative">

    <div class="relative z-10 flex flex-col items-center text-center px-4">
        <div class="mb-12 animate-float relative">
            <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-white/5 to-white/0 flex items-center justify-center shadow-[0_0_40px_rgba(100,108,255,0.15)] backdrop-blur-sm border border-white/5">
                <i class="bi bi-tools text-4xl text-primary drop-shadow-[0_0_10px_rgba(100,108,255,0.5)]"></i>
            </div>
        </div>

        <h1 class="text-4xl md:text-6xl font-bold tracking-tight mb-6 bg-clip-text text-transparent bg-gradient-to-b from-white via-white to-white/50 pb-2">
            Maintenance
        </h1>

        <p class="text-lg text-gray-400 font-light max-w-md leading-relaxed mx-auto">
            Nous effectuons quelques optimisations pour améliorer votre expérience. <br />
            Revenez d'ici quelques minutes.
        </p>

        <div class="mt-12 flex flex-col items-center gap-4">
            <div class="px-6 py-2 rounded-full border border-white/10 text-xs text-gray-500 uppercase tracking-[0.2em]">
                Statut : Travaux en cours
            </div>
            <!-- <a href="https://status.tonsite.com" class="text-primary hover:text-white transition-colors text-sm font-medium">
                <i class="bi bi-info-circle mr-2"></i>Consulter l'état des services
            </a> -->
        </div>
    </div>

    <div class="absolute bottom-8 w-full text-center">
        <p class="text-white/20 text-xs tracking-[0.2em] font-medium uppercase">&copy; Silvercore host</p>
    </div>

</body>
</html>
